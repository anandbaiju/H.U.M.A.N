<script>
const A={am:'#A8751F',cy:'#1F6F78',em:'#4E8A68'},ac=['am','cy','em'];
const cd=(a,o={})=>a.map((x,i)=>`<div class="c rv" style="--i:${i};--a:${A[x[3]||ac[i%3]]}">${x[4]?`<div class="big" data-n="${x[4]}">${x[4]}</div><div class="lab">${x[0]}</div>`:`<h3>${x[0]}</h3>`}${Array.isArray(x[1])?'<ul>'+x[1].map(l=>`<li>${l}</li>`).join('')+'</ul>':`<p>${x[1]}</p>`}${x[2]?`<p class="m" style="color:var(--cy);font-size:11px;margin-top:10px">${x[2]}</p>`:''}</div>`).join('');
const G=(a,c3)=>`<div class="g ${c3?'c3':''}">${cd(a)}</div>`;
const BN=(l,t,c)=>`<div class="bn rv" style="--a:${A[c||'am']}"><b>${l}</b>${t}</div>`;
const TB=(h,r,o={})=>`<div class="tw rv"><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${r.map(x=>`<tr>${x.map((y,i)=>`<td class="${o.h&&i==x.length-1?'h':''}${o.r&&i==x.length-1?'r':''}">${y}</td>`).join('')}</tr>`).join('')}</table></div>`;
const S=[];const add=(id,k,t,b)=>S.push(`<section class="s" id="${id}"><div class="w"><div class="k">${k}</div><h2 class="rv">${t}</h2>${b}</div></section>`);
S.push(`<section class="s hero" id="top"><div class="w"><div class="k">PALS innoWAH! INNOVATION CHALLENGE | CONCEPT AND DESIGN</div><h1>H.U.M.A.N</h1><div class="sub">High-Utility Multi-GNSS Autonomous Navigator</div><p>An Ultra-Resilient, Solar-Harvested NavIC Offline Tactical Navigation and Environmental Telemetry System</p><p>A pocket-sized, 100% air-gapped navigator for disaster zones, wilderness expeditions and tactical field use: zero cellular, zero SIM, zero cloud.</p>${G([['Network / SIM dependency','','','am','0%'],['Multi-constellation fix','','','cy','NavIC + GPS'],['Zero-degradation storage','','','em','10+ Years'],['Target unit BOM','','','am','< ₹3,500']])}<p class="m" style="font-size:12px;margin-top:24px">Embedded Systems | Disaster Resilience | Defense &amp; Wilderness Safety</p></div></section>`);
add('problem','1 PROBLEM DEFINITION','Navigation Fails Exactly When Infrastructure Fails',G([['CELLULAR FRAGILITY','Floods, cyclones and landslides take down towers and grid power; assisted-GPS cold locks drag on and map tiles never load.','','am','10–15 min'],['BATTERY DEGRADATION','Li-ion/Li-Po cells lose capacity in cold, swell in heat and die when left uncharged in emergency kits.','','cy','2–3 yrs'],['SCREEN VS. POWER DRAW','Backlit OLED/LCD panels wash out in midday sun and drain a phone within hours.','','am','300–1,200 mW'],['STATIC BEARING BLINDNESS','GNSS gives no heading when stationary; a lost or injured person must pace over risky terrain.','','cy','10–20 m']])+BN('BACKGROUND','Consumer smartphones depend on cloud-assisted GPS and carrier signals, so a lost handset keeps searching for towers that no longer exist. Commercial satellite communicators are closed-source, expensive and locked behind recurring subscriptions. Neither is built for a months-long wait in an emergency kit.','em'));
add('scenario','1 PROBLEM DEFINITION | ARTICULATION','Articulating the Problem: A Disaster Field Scenario',G([['1 Event strikes','Cyclone, flood or landslide cuts off a trekking group or response team.'],['2 Grid &amp; towers fail','No carrier signal, no mains power, no charging point.'],['3 Phone becomes a brick','Maps will not load and the battery drains while hunting for signal.'],['4 Stationary and lost','No heading without walking; pacing on unstable ground adds risk.']])+'<h3 class="rv" style="margin-top:36px;color:var(--cy)">What today’s options leave unsolved</h3>'+G([['Smartphones','Cloud-dependent maps, A-GPS, short battery life, unreadable in sun.'],['Satellite communicators','Closed-source, costly and tied to subscriptions.'],['DIY maker builds','Fragile prototypes, standard GPS only, no true compass.']],1));
add('gains','2 IDEA / CONCEPT / SOLUTION','Pains Addressed and Gains Delivered',`<div class="g c3" style="grid-template-columns:1fr 1fr">${[['No signal means no map, no position, no help','Works fully offline on NavIC + GPS: 100% air-gapped'],['Emergency-kit phone is dead after months in storage','Solar wake-up even after years of dormancy'],['Screen unreadable under direct sunlight','Sunlight-readable MIP display at under 50 µW'],['Pacing to find heading is physically hazardous','Instant heading while standing still'],['Paid subscriptions and ₹15,000–₹80,000 devices','Under ₹3,500 and no recurring fees']].map((r,i)=>`<div class="c rv" style="--i:${i};--a:var(--am)"><div class="k">PAINS FACED</div>${r[0]}</div><div class="c rv" style="--i:${i};--a:var(--em)"><div class="k" style="color:var(--em)">GAINS ACHIEVED</div><b>${r[1]}</b></div>`).join('')}</div>`);
add('parts','2 IDEA / CONCEPT / SOLUTION | SUB-COMPONENTS','Sub-Components and Engineering Principles',G([['1 Satellite engine','Quectel L76K multi-GNSS decoding NavIC (L5) and GPS (L1) over UART.','RF &amp; satellite communication, signal processing'],['2 Electronic compass','QMC5883L 3-axis magnetometer gives absolute heading without motion.','Magnetics, sensor fusion, calibration'],['3 Barometer','BMP280 for sub-meter altitude and the dP/dt storm alarm.','Fluid mechanics, atmospheric physics'],['4 Solar power chain','BQ25570 MPPT harvester charging LiFePO4 / supercapacitor storage.','Power electronics, electrochemistry'],['5 MIP display','Transflective Memory-in-Pixel panel over SPI, readable by reflected sunlight.','Optics, low-power electronics'],['6 Edge computing','ESP32-S3 on FreeRTOS: Haversine math, LittleFS waypoints, ULP sleep.','Embedded software, spherical trigonometry']],1));
add('usp','2 IDEA / CONCEPT / SOLUTION | UNIQUE SELLING PROPOSITION','Unique Selling Proposition: Why H.U.M.A.N Is Different',TB(['Feature','Consumer smartphone','DIY maker project','H.U.M.A.N'],[['Cellular dependency','High (A-GPS, cloud map tiles)','High / mixed','Zero: 100% air-gapped'],['Satellite constellation','Generic GPS (L1 only on budget phones)','Standard GPS (NEO-6M)','NavIC (L5/S) + multi-GNSS'],['Static orientation','Drifts or needs motion','Fails without magnetometer','QMC5883L 3-axis true compass'],['Daylight optics','~500 mW backlight, washes out','Standard OLED / RGB LED ring','Transflective MIP, &lt; 50 µW'],['Shelf life &amp; storage','Li-Po degrades in 2–3 years','Standard 18650 Li-ion','LiFePO4 + MPPT: 10+ years'],['Weather telemetry','Cloud API dependent','None','Local barometer (dP/dt)'],['Estimated unit cost','₹15,000–₹80,000','~₹2,000 (fragile)','&lt; ₹3,500 (ruggedized)']],{h:1})+BN('THE EDGE','The only open, subscription-free navigator that combines indigenous NavIC, a true static compass, sunlight-readable optics and solar self-recharge.'));
const nb=(x,y,w,h,c,t,d)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#FFFFFF" stroke="#D5DDD6"/><rect x="${x}" y="${y}" width="4" height="${h}" fill="${c}"/><text x="${x+16}" y="${y+24}" fill="#14303A" font-size="13" font-weight="700">${t}</text><text x="${x+16}" y="${y+46}" fill="#5A6B70" font-size="11">${d}</text>`;
const fp=(d,c)=>`<path d="${d}" fill="none" stroke="${c}" stroke-width="2.5" class="fl" style="color:${c}"/>`;
add('block','3 PROJECT DESCRIPTION &amp; HIGH-LEVEL DESIGN','High-Level Block Diagram: Five Subsystems on One Core',`<div class="tw rv"><svg viewBox="0 0 960 520" style="min-width:760px;width:100%;margin-top:24px">${nb(10,10,270,80,A.cy,'Multi-GNSS: NavIC + GPS','UART → coordinates, speed, UTC')}${nb(10,120,270,80,A.cy,'QMC5883L magnetometer','I2C → static heading (azimuth)')}${nb(10,230,270,80,A.cy,'BMP280 barometer','I2C → altitude and dP/dt alarm')}
<rect x="350" y="10" width="260" height="300" fill="#FFFFFF" stroke="#A8751F" stroke-width="2"/><text x="370" y="40" fill="#A8751F" font-size="15" font-weight="700">ESP32-S3 SYSTEM CORE</text>${['FreeRTOS bare-metal firmware','LittleFS: safe zones &amp; waypoints','Haversine distance + true bearing','Heading fusion and dP/dt storm alarm','ULP deep-sleep power management'].map((t,i)=>`<text x="370" y="${78+i*40}" fill="#14303A" font-size="12">▸ ${t}</text>`).join('')}
${nb(680,10,270,140,A.em,'Transflective MIP display','SPI. Sunlight readable + momentary frontlight')}${nb(680,180,270,100,A.em,'Rotary encoder + switch','GPIO interrupts')}
${fp('M280 50H350',A.cy)}${fp('M280 160H350',A.cy)}${fp('M280 270H350',A.cy)}${fp('M610 80H680',A.em)}${fp('M680 230H610',A.em)}
<text x="10" y="350" fill="#A8751F" font-size="12" font-weight="700">POWER CHAIN</text>${nb(10,365,215,90,A.am,'Monocrystalline solar cell','5 V / 100 mA rear panel')}${nb(255,365,215,90,A.am,'TI BQ25570 nano-power MPPT','Cold-starts from 330 mV')}${nb(500,365,215,90,A.am,'LiFePO4 / supercap → 3.3 V','Powers every rail above')}${fp('M225 410H255',A.am)}${fp('M470 410H500',A.am)}${fp('M607 365V310',A.am)}
<text x="740" y="400" fill="#4E8A68" font-size="11">Sunlight → harvested energy →</text><text x="740" y="418" fill="#4E8A68" font-size="11">regulated supply for the whole</text><text x="740" y="436" fill="#4E8A68" font-size="11">node. No grid, no cellular, no cloud.</text></svg></div>`);
add('algo','3 PROJECT DESCRIPTION &amp; HIGH-LEVEL DESIGN | MAKING IT WORK','How It Works in Real Life: Three Local Algorithms',`<div class="g c3">${[['Haversine distance &amp; bearing','a = sin²(Δφ/2) + cosφ₁·cosφ₂·sin²(Δλ/2)\nd = 2R · atan2(√a, √(1−a))\nθ = atan2(sinΔλ·cosφ₂, cosφ₁·sinφ₂ − sinφ₁·cosφ₂·cosΔλ)','Range and target heading from current fix (φ₁, λ₁) to waypoint (φ₂, λ₂), computed on-device.','am'],['Static vector correction','arrow = θ − heading\nheading = QMC5883L azimuth + magnetic declination','The on-screen arrow points at the target even when the user stands completely still.','cy'],['Barometric storm warning','ΔP / Δt ≤ −2.0 hPa\nover a 2-hour rolling window\n(ΔP/Δt ≤ −2.0 hPa / 2h)','BMP280 samples continuously; a fast pressure drop raises a visible storm / monsoon alert.','em']].map((a,i)=>`<div class="c rv" style="--i:${i};--a:${A[a[3]]}"><h3>${a[0]}</h3><pre style="color:${A[a[3]]}">${a[1]}</pre><p>${a[2]}</p></div>`).join('')}</div>`+BN('COLD-START SOLAR WAKE-UP','After years of dormancy, direct sunlight lets the MPPT harvester bootstrap the rails, acquire a satellite lock and show orientation, with no AC grid access.'));
const bom=[['ESP32-S3-WROOM-1 (16 MB)','Core MCU + LittleFS flash',380],['Quectel L76K GNSS','NavIC (L5) + GPS engine',950],['QMC5883L magnetometer','Static-bearing compass',120],['BMP280 barometer','Altitude + storm warning',85],['1.28" transflective MIP','Sunlight-readable display',850],['TI BQ25570 MPPT IC','Nano-power solar harvester',350],['5 V monocrystalline strip','Photovoltaic input',110],['LiFePO4 cell 3.2 V 600 mAh','2,000+ cycle storage',180],['IP65 casing + rotary encoder','Enclosure and controls',175]];
add('bom','3 PROJECT DESCRIPTION &amp; HIGH-LEVEL DESIGN | VIABILITY','Financial Viability and Market Acceptance',`<div class="g" style="grid-template-columns:3fr 2fr">${TB(['Component','Role','Est. cost'],bom.map(r=>[r[0],r[1],'₹'+r[2]]).concat([['Total prototype BOM','','~₹<span data-n="3200" data-c="1">3,200</span>']]),{r:1})}<div>${cd([['lower cost than ₹35,000–₹65,000+ commercial satellite navigators','','','am','11–20×']])}${`<div class="c rv" style="--a:var(--em);margin-top:16px"><h3>Why buyers will accept it</h3><ul>${['Priced for bulk issue to SDMA, NDRF and forest staff','No subscription or SIM to manage','Open-source firmware that agencies can audit','Margin headroom under the ₹3,500 target'].map(x=>`<li>${x}</li>`).join('')}</ul></div>`}</div></div>`);
add('theme','4 RELEVANCE TO THE THEME','Relevance to innoWAH! 2026-27: Bolts and Bots',`<div class="g c3" style="grid-template-columns:1fr 1fr">${cd([['BOLTS: core engineering',['Power electronics: BQ25570 MPPT, LiFePO4 storage','Electronics: 2-layer KiCad PCB, 50 Ω RF traces','Optics: transflective MIP display','Mechanical: IP65/IP67 sealed enclosure','Solar panel and rugged controls'],'','am'],['BOTS: digital technology',['FreeRTOS firmware on ESP32-S3','NMEA parsing, NavIC PRN validation','Haversine and bearing computation','Magnetometer fusion, dP/dt alarm logic','LittleFS offline emergency database'],'','cy']])}</div>`+TB(['Industry domain','Technology specialization'],[['Disaster management &amp; public safety','Embedded systems, edge computing, offline navigation'],['Defense &amp; tactical operations','Satellite navigation (NavIC / multi-GNSS), passive RF'],['Energy / sustainability','Solar energy harvesting, long-life energy storage']])+BN('DISCIPLINES TOUCHED','Electronics, Electrical / Power, Computer &amp; Embedded, Mechanical, Space &amp; Navigation.','em'));
add('survey','5 MARKET SURVEY (PLANNED)','Market Survey Plan: Validating the Problem with Real Users',G([['1 Customer segments',['Disaster responders (NDRF, SDRF, fire &amp; rescue)','Forest rangers and wildlife staff','Trekkers, mountaineers, expedition guides','Defense and paramilitary field units']],['2 Sample size &amp; locations',['Target ~100 responses (proposed)','~30 responders, ~40 outdoor users, ~30 tactical / others','Hill, coastal-cyclone and forest regions','Physical interviews plus an online form']],['3 Data analysis',['Rank pains: signal loss, battery, sun glare, heading','Willingness to pay against the ₹3,500 target','Feature priority scoring','Historical NDMA / IMD disaster data as cross-check']]],1)+BN('OUTCOME','Validated problem statement, ranked feature list and a price point to refine the BOM. Detailed results go in the Appendix.'));
add('benefits','6 PROJECT BENEFITS','Expected Benefits of H.U.M.A.N',G([['Safety','Reliable position and heading when every other tool has failed.'],['Reliability','10+ year shelf life; wakes from sunlight after long storage.'],['Affordability','Under ₹3,500 per unit, with no subscription or SIM.'],['Sovereignty','Uses India’s NavIC alongside GPS for resilient local coverage.'],['Sustainability','Solar-charged long-cycle cells reduce disposable battery waste.'],['Privacy &amp; stealth','Passive receive-only RF: no transmissions, no tracking, no cloud.']],1)+'<p class="m rv" style="font-size:12px;color:var(--mu);margin-top:20px">Benefits are design targets, to be confirmed through the field validation phase.</p>');
add('kyc','7 MARKET ASSESSMENT &amp; READINESS','Know Your Customer and Know Your Competitor',`<div class="g c3" style="grid-template-columns:1fr 1fr">${cd([['KYC1: Potential customer segments',['Disaster response: NDRF, SDRF, SDMA','Forest departments and rangers','Defense and paramilitary field units','Trekking, mountaineering and expedition operators','Remote-area field workers and surveyors'],'','am'],['KYC2: Known competitors',['Satellite communicators and handhelds (Garmin inReach / GPSMAP class): ₹35,000–₹65,000+','Smartphones with offline-map apps: ₹15,000–₹80,000','DIY NEO-6M GPS builds: ~₹2,000, fragile and GPS-only','Generic handheld GPS units: no NavIC, no solar recharge'],'','cy']])}</div>`+BN('GO-TO-MARKET','Bulk institutional buyers first, retail outdoor users next.')+BN('OUR EDGE','NavIC, solar autonomy and static heading at a fraction of the price.','em'));
add('road','8 ANY OTHER INFORMATION | ROADMAP','Implementation Roadmap and Next Milestones',G([['PHASE 1: Breadboard firmware',['ESP32-S3 + GNSS over UART, NMEA via TinyGPS++','Validate NavIC PRN locks','I2C loops for QMC5883L, BMP280']],['PHASE 2: Power &amp; optics',['Benchmark BQ25570 with 5 V solar strip','ULP sleep, GNSS wake every 30 s','SPI MIP display graphics']],['PHASE 3: PCB consolidation',['2-layer KiCad schematic and PCB','50 Ω RF antenna routing','IP65/IP67 3D-modeled enclosure']],['PHASE 4: Field validation',['TTFF under canopy vs. smartphones','48-hour battery and solar curves','Pitch deck and live bench demo']]])+BN('H.U.M.A.N','Empowering offline responders with sovereign precision. Ready for prototype demonstration and field deployment. Open for questions and evaluation.'));
S.splice(1,0,`<section class="s" id="sim"><div class="w"><div class="k">LIVE CONCEPT STORYBOARD</div><h2>Concept Storyboard &amp; Live H.U.M.A.N Hardware Emulator</h2><div class="tabs" id="tb"></div><div class="sim"><div class="dev"><div class="scr" id="scr"></div><i id="cap"></i></div><div><div class="pn"><h3 id="st"></h3><p id="sd"></p><div id="ex"></div></div><div style="display:flex;gap:8px;margin-top:14px"><button class="btn on" id="pp">Auto-play: on</button></div></div></div></div></section>`);
document.getElementById('m').innerHTML=S.join('');
// counters + reveal
const cnt=e=>{const t=e.dataset.n.replace(/[^0-9]/g,'');if(!t)return;const n=+t,pre=e.dataset.n.replace(/[0-9,.–×\s].*$/,''),suf=e.dataset.n.replace(/^[^0-9]*[0-9,]+/,'');if(e.dataset.n.match(/[–]/)||e.dataset.n[0]=='0'&&n==0)return;const t0=performance.now();(function f(t1){const k=Math.min(1,(t1-t0)/1400),v=Math.round(n*(1-Math.pow(1-k,3)));e.textContent=pre+v.toLocaleString('en-IN')+suf;if(k<1)requestAnimationFrame(f)})(t0)};
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');e.target.querySelectorAll('[data-n]').forEach(cnt);if(e.target.dataset.n)cnt(e.target);io.unobserve(e.target)}}),{threshold:.15});
document.querySelectorAll('.rv').forEach(e=>io.observe(e));
// math
const R=6371000,rad=x=>x*Math.PI/180;
function hv(a,b,c,d){const p1=rad(a),p2=rad(c),dp=p2-p1,dl=rad(d-b),x=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;const dist=2*R*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));const th=(Math.atan2(Math.sin(dl)*Math.cos(p2),Math.cos(p1)*Math.sin(p2)-Math.sin(p1)*Math.cos(p2)*Math.cos(dl))*180/Math.PI+360)%360;return[dist,th]}
const sv=(h,a,l)=>`<svg viewBox="-100 -100 200 200" width="100%" style="max-width:220px"><circle r="92" fill="none" stroke="#1c2418" stroke-width="2"/>${['N','E','S','W'].map((t,i)=>`<text x="${Math.sin(i*Math.PI/2-rad(h))*78}" y="${-Math.cos(i*Math.PI/2-rad(h))*78+5}" text-anchor="middle" font-size="13" fill="#1c2418">${t}</text>`).join('')}<g transform="rotate(${a})"><path d="M0-60L12-10H4V40H-4V-10H-12Z" fill="#1c2418"/></g><text y="92" text-anchor="middle" font-size="9" fill="#1c2418" transform="translate(0,-8)">${l}</text></svg>`;
// simulator
const sc=['1 Cyclone to cold-start','2 NavIC + GPS lock','3 Static compass','4 Storm warning'];let cur=0,t=0,auto=true,hd=40,P=1008.4;const $=i=>document.getElementById(i);
$('tb').innerHTML=sc.map((x,i)=>`<button data-i="${i}">${x}</button>`).join('');
function go(i){cur=i;t=0;document.querySelectorAll('#tb button').forEach((b,j)=>b.classList.toggle('on',i==j));const E={0:['Scene 1: Cyclone hits, towers fail','The smartphone loses service and dies. H.U.M.A.N wakes from a 330 mV solar cold-start after years of dormancy.',''],1:['Scene 2: Live NavIC (L5) + GPS lock','Haversine range and true bearing to the waypoint computed on-device.',''],2:['Scene 3: Static vector correction','Drag the slider to rotate the virtual device. The QMC5883L azimuth updates the arrow while the user stands completely still.','<input type="range" id="rg" min="0" max="359" value="'+hd+'" aria-label="Device heading"><p class="m" id="rl"></p>'],3:['Scene 4: Barometric storm warning','BMP280 pressure falls over a 2-hour rolling window. At ΔP/Δt ≤ −2.0 hPa / 2h the alarm triggers.','<input type="range" id="rg" min="0" max="40" value="0" aria-label="Pressure drop"><p class="m" id="rl"></p>']}[i];$('st').textContent=E[0];$('sd').textContent=E[1];$('ex').innerHTML=E[2];if($('rg'))$('rg').oninput=e=>{auto=false;$('pp').textContent='Auto-play: off';$('pp').classList.remove('on');if(i==2)hd=+e.target.value;else P=1008.4-e.target.value/10;draw()};draw()}
function draw(){const s=$('scr');s.classList.remove('al');
 if(cur==0){const ph=Math.min(t,12);const v=Math.min(330,Math.max(0,(t-4)*55));const boot=v>=330;$('cap').textContent=t<2?'CYCLONE LANDFALL':t<4?'CELL TOWERS OFFLINE':boot?'H.U.M.A.N ONLINE':'SOLAR COLD-START';s.innerHTML=boot?`<div>H.U.M.A.N<br>NavIC+GPS<br>HDG 042° ▲<br>P 1008.4 hPa<br>No SIM · No cloud</div>`:`<div>HARVEST<br>${Math.round(v)} / 330 mV<br>${'█'.repeat(Math.round(v/33))}${'░'.repeat(10-Math.round(v/33))}</div>`;$('ex').innerHTML=`<div class="ph">SMARTPHONE<br>${t<2?'LTE ▂▄▆█ 41%':t<4?'No service · searching… 23%':'Battery 0% · dead'}</div>`}
 if(cur==1){const n=Math.min(12,2+t*2),L=n>=8,[d,th]=hv(10.0159,76.3419,10.0412,76.3680);$('cap').textContent=L?'FIX: 3D · L5+L1':'ACQUIRING…';s.innerHTML=`<div>${L?'NavIC L5: 5 SV<br>GPS L1: '+(n-5)+' SV':'SATS '+n+'…'}<br>φ₂,λ₂ WPT-01<br>d=${L?(d/1000).toFixed(2)+' km':'—'}<br>θ=${L?th.toFixed(1)+'°':'—'}</div>`;$('ex').innerHTML=`<pre style="color:var(--cy)">a = sin²(Δφ/2)+cosφ₁cosφ₂sin²(Δλ/2)\nd = 2R·atan2(√a,√(1−a))</pre>`}
 if(cur==2){if(auto)hd=(t*37)%360;const th=hv(10.0159,76.3419,10.0412,76.3680)[1],a=th-hd;$('cap').textContent='STATIONARY · NO MOTION';s.innerHTML=sv(hd,a,'HDG '+Math.round(hd)+'°');$('rl').textContent='heading='+Math.round(hd)+'° θ='+th.toFixed(0)+'° arrow='+(((a%360)+360)%360).toFixed(0)+'°';if($('rg'))$('rg').value=hd}
 if(cur==3){if(auto)P=1008.4-Math.min(t,12)*.2;const dP=P-1008.4,al=dP<=-2;$('cap').textContent=al?'STORM / MONSOON ALERT':'MONITORING (2 h window)';s.innerHTML=al?`<div>⚠ STORM WARNING<br>ΔP/Δt ${dP.toFixed(1)} hPa/2h<br>${P.toFixed(1)} hPa<br>SEEK SHELTER</div>`:`<div>BMP280<br>${P.toFixed(1)} hPa<br>ΔP/Δt ${dP.toFixed(1)} hPa/2h<br>limit −2.0</div>`;if(al)s.classList.add('al');$('rl').textContent=`ΔP = ${dP.toFixed(1)} hPa over 2 h ${al?'≤ −2.0: ALARM':''}`;if($('rg')&&auto)$('rg').value=-dP*10}}
$('tb').onclick=e=>{if(e.target.dataset.i){auto=false;$('pp').textContent='Auto-play: off';$('pp').classList.remove('on');go(+e.target.dataset.i)}};
$('pp').onclick=()=>{auto=!auto;$('pp').textContent='Auto-play: '+(auto?'on':'off');$('pp').classList.toggle('on',auto)};
setInterval(()=>{if(cur!=2||auto)t++;if(auto&&t>14)go((cur+1)%4);else draw()},900);go(0);
// slide mode
let sm=false,ix=0;const secs=[...document.querySelectorAll('.s')];
function show(i,b){ix=Math.max(0,Math.min(secs.length-1,i));secs.forEach((s,j)=>{s.classList.toggle('cur',j==ix);s.classList.toggle('back',!!b)});secs[ix].scrollTop=0;secs[ix].querySelectorAll('[data-n]').forEach(cnt)}
function tog(){sm=!sm;document.documentElement.classList.toggle('sm',sm);document.body.classList.toggle('sm',sm);$('sb').textContent=sm?'Exit slide mode':'Slide mode';$('pv').hidden=$('nx').hidden=!sm;if(sm){const y=scrollY;ix=Math.max(0,secs.findIndex(s=>s.getBoundingClientRect().bottom>innerHeight/2));show(ix)}else{secs.forEach(s=>s.classList.remove('cur'));secs[ix].scrollIntoView()}}
$('sb').onclick=tog;$('nx').onclick=()=>show(ix+1);$('pv').onclick=()=>show(ix-1,1);
addEventListener('keydown',e=>{if(!sm||e.target.tagName=='INPUT')return;if(e.key=='ArrowRight'||e.key==' ')show(ix+1);if(e.key=='ArrowLeft')show(ix-1,1);if(e.key=='Escape')tog()});
